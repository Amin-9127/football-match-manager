plugins {
    id 'com.android.application'
}

android {
    namespace 'com.amin.footballmanager'
    compileSdk 34

    defaultConfig {
        applicationId 'com.amin.footballmanager'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // Serve the web app straight from the shared /web folder
            assets.srcDirs = ['../web']
        }
    }
}
